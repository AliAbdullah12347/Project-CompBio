<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1015" viewBox="0 0 980 1015" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#000"/></marker></defs>
<rect width="980" height="1015" fill="#ffffff"/>
<line x1="450" y1="84" x2="696" y2="78" stroke="#9A9A9A" stroke-width="1"/>
<line x1="660" y1="222" x2="698" y2="222" stroke="#9A9A9A" stroke-width="1"/>
<line x1="200" y1="388" x2="208" y2="388" stroke="#9A9A9A" stroke-width="1"/>
<line x1="200" y1="436" x2="208" y2="400" stroke="#9A9A9A" stroke-width="1"/>
<line x1="390" y1="402" x2="410" y2="396" stroke="#9A9A9A" stroke-width="1"/>
<line x1="490" y1="694" x2="516" y2="694" stroke="#9A9A9A" stroke-width="1"/>
<text x="490" y="42" font-size="19" font-weight="bold" text-anchor="middle">PREDICTION CONTEST ARM</text>
<ellipse cx="300" cy="84" rx="150" ry="28" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="81.0" font-size="11.5" fill="#000000" text-anchor="middle">Keep only BP1: where</text>
<text x="300" y="96.0" font-size="11.5" fill="#000000" text-anchor="middle">Lithium varies</text>
<text x="700" y="81.0" font-size="11" fill="#C55A11">226 samples. 74 not on Lithium,</text>
<text x="700" y="95.0" font-size="11" fill="#C55A11">152 on Lithium</text>
<rect x="60" y="150" width="620" height="475" fill="none" stroke="#2E74B5" stroke-width="1.4" stroke-dasharray="7 5" rx="6"/>
<text x="370" y="171" font-size="12" font-weight="bold" fill="#2E74B5" text-anchor="middle">REPEAT 25×  —  a different random partition each time</text>
<rect x="180" y="196" width="240" height="52" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="219.0" font-size="11.5" fill="#000000" text-anchor="middle">Outer split: stratified</text>
<text x="300" y="234.0" font-size="11.5" fill="#000000" text-anchor="middle">3-fold CV over all 226</text>
<rect x="460" y="196" width="200" height="52" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="560" y="219.0" font-size="11.5" fill="#000000" text-anchor="middle">Outer test fold —</text>
<text x="560" y="234.0" font-size="11.5" fill="#000000" text-anchor="middle">one third, rotating</text>
<text x="700" y="211.0" font-size="11" fill="#C55A11">Replaces the 10% holdout. Every</text>
<text x="700" y="225.0" font-size="11" fill="#C55A11">subject lands in the test fold exactly</text>
<text x="700" y="239.0" font-size="11" fill="#C55A11">once per repeat, so the evaluation</text>
<text x="700" y="253.0" font-size="11" fill="#C55A11">set is all 226 — not 23.</text>
<rect x="146" y="290" width="80" height="34" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="186" y="311.5" font-size="11.5" fill="#000000" text-anchor="middle">PPMa</text>
<rect x="260" y="290" width="80" height="34" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="311.5" font-size="11.5" fill="#000000" text-anchor="middle">PPMb</text>
<rect x="374" y="290" width="80" height="34" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="414" y="311.5" font-size="11.5" fill="#000000" text-anchor="middle">PPMc</text>
<rect x="210" y="366" width="60" height="24" fill="#F2F2F2" stroke="#000000" stroke-width="1"/>
<text x="240" y="382" font-size="11.5" text-anchor="middle" font-weight="bold">Test</text>
<rect x="270" y="366" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="300" y="382" font-size="11.5" text-anchor="middle">Train</text>
<rect x="330" y="366" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="360" y="382" font-size="11.5" text-anchor="middle">Train</text>
<rect x="210" y="390" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="240" y="406" font-size="11.5" text-anchor="middle">Train</text>
<rect x="270" y="390" width="60" height="24" fill="#F2F2F2" stroke="#000000" stroke-width="1"/>
<text x="300" y="406" font-size="11.5" text-anchor="middle" font-weight="bold">Test</text>
<rect x="330" y="390" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="360" y="406" font-size="11.5" text-anchor="middle">Train</text>
<rect x="210" y="414" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="240" y="430" font-size="11.5" text-anchor="middle">Train</text>
<rect x="270" y="414" width="60" height="24" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text x="300" y="430" font-size="11.5" text-anchor="middle">Train</text>
<rect x="330" y="414" width="60" height="24" fill="#F2F2F2" stroke="#000000" stroke-width="1"/>
<text x="360" y="430" font-size="11.5" text-anchor="middle" font-weight="bold">Test</text>
<text x="10" y="385.0" font-size="11" fill="#2E74B5">Do this CV for each</text>
<text x="10" y="399.0" font-size="11" fill="#2E74B5">of the splits</text>
<text x="10" y="433.0" font-size="11" fill="#2E74B5">Train Using Random Forest</text>
<text x="10" y="447.0" font-size="11" fill="#2E74B5">and Elastic Net</text>
<text x="412" y="386.0" font-size="11" fill="#C55A11" font-weight="bold">INNER loop — tuning only.</text>
<text x="412" y="400.0" font-size="11" fill="#C55A11">Within these, tune the</text>
<text x="412" y="414.0" font-size="11" fill="#C55A11">hyperparameters to get the</text>
<text x="412" y="428.0" font-size="11" fill="#C55A11">best prediction results.</text>
<rect x="130" y="470" width="340" height="56" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="487.5" font-size="11.5" fill="#C55A11" text-anchor="middle">Once satisfied, build one new model that runs</text>
<text x="300" y="502.5" font-size="11.5" fill="#C55A11" text-anchor="middle">on the entire outer-training set using the</text>
<text x="300" y="517.5" font-size="11.5" fill="#C55A11" text-anchor="middle">tuned hyperparameters</text>
<rect x="130" y="546" width="340" height="56" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="563.5" font-size="11.5" fill="#C55A11" text-anchor="middle">Test this model on the outer test fold once,</text>
<text x="300" y="578.5" font-size="11.5" fill="#C55A11" text-anchor="middle">and record the AUC for predicting</text>
<text x="300" y="593.5" font-size="11.5" fill="#C55A11" text-anchor="middle">lithium usage</text>
<rect x="110" y="660" width="380" height="70" fill="#fff" stroke="#000000" stroke-width="1.2"/>
<text x="300" y="677.0" font-size="11.5" fill="#C55A11" text-anchor="middle">Pool the out-of-fold predictions from all 25</text>
<text x="300" y="692.0" font-size="11.5" fill="#C55A11" text-anchor="middle">repeats. Bootstrap over subjects (2,000</text>
<text x="300" y="707.0" font-size="11.5" fill="#C55A11" text-anchor="middle">resamples) for a 95% CI on the difference in</text>
<text x="300" y="722.0" font-size="11.5" fill="#C55A11" text-anchor="middle">AUC between inputs.</text>
<text x="520" y="685.0" font-size="11" fill="#C55A11">This replaces a single accuracy number. Compare the</text>
<text x="520" y="699.0" font-size="11" fill="#C55A11">interval with the pre-declared ±0.05 equivalence margin:</text>
<text x="520" y="713.0" font-size="11" fill="#C55A11">entirely inside it = equivalent, straddling it = inconclusive.</text>
<rect x="10" y="770" width="470" height="110" fill="#fff" stroke="#C55A11" stroke-width="1.2"/>
<text x="18" y="801.0" font-size="11" fill="#C55A11" font-weight="bold">Why the separate 10% test set is gone</text>
<text x="18" y="815.0" font-size="11" fill="#C55A11">A 10% holdout of 226 is about 23 people, roughly 7 lithium</text>
<text x="18" y="829.0" font-size="11" fill="#C55A11">non-users. The 95% CI on an AUC that small is about ±0.26,</text>
<text x="18" y="843.0" font-size="11" fill="#C55A11">which cannot resolve a ±0.05 equivalence margin. The</text>
<text x="18" y="857.0" font-size="11" fill="#C55A11">rotating outer fold tests every one of the 226 instead.</text>
<rect x="500" y="770" width="470" height="110" fill="#fff" stroke="#C55A11" stroke-width="1.2"/>
<text x="508" y="815.0" font-size="11" fill="#C55A11">Note: We run the whole pipeline multiple times, once for each</text>
<text x="508" y="829.0" font-size="11" fill="#C55A11">input we define in the proposal, at the end, we see which input</text>
<text x="508" y="843.0" font-size="11" fill="#C55A11">gives the more accurate prediction.</text>
<rect x="10" y="900" width="470" height="90" fill="#fff" stroke="#C55A11" stroke-width="1.2"/>
<text x="18" y="935.0" font-size="11" fill="#C55A11">Note: Could also try to see how accurate each input is at</text>
<text x="18" y="949.0" font-size="11" fill="#C55A11">predicting BP diagnoses, which would not require too many</text>
<text x="18" y="963.0" font-size="11" fill="#C55A11">changes to this flowchart.</text>
<line x1="300" y1="112" x2="300" y2="194" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="300" y1="438" x2="300" y2="468" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="300" y1="526" x2="300" y2="544" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<line x1="300" y1="602" x2="300" y2="658" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M300,248 L300,268 L186,268 L186,288" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M300,268 L414,268 L414,288" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M300,268 L300,288" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M186,324 L186,346 L300,346" fill="none" stroke="#000000" stroke-width="1.3"/>
<path d="M414,324 L414,346 L300,346" fill="none" stroke="#000000" stroke-width="1.3"/>
<path d="M300,324 L300,364" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M420,222 L458,222" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#a)"/>
</svg>
