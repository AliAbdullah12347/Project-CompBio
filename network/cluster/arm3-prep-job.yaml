# Step 1 of 3. Rebuilds the base-001 reference cache (gitignored, iMac-only)
# and the prebuilt R library, and puts both in S3 so the fan-out jobs start in
# a minute instead of ten. Submit this FIRST and let it finish; arm3-queue and
# arm3-perm031 both fail fast without the reference cache.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: arm3-prep
spec:
  queue: cpu
  ttlSecondsAfterFinished: 604800
  tasks:
    - name: main
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          activeDeadlineSeconds: 10800        # 3 h; the build is ~30 min
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: {type: RuntimeDefault}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 18Gi}
            - name: s3-ca
              configMap: {name: s3-ca}
          containers:
            - name: main
              image: bioconductor/bioconductor_docker:RELEASE_3_20
              workingDir: /work
              envFrom: [{secretRef: {name: s3-credentials}}]
              env:
                - {name: HOME,          value: /work}
                - {name: R_LIBS_USER,   value: /work/rlibs}
                - {name: AWS_CA_BUNDLE, value: /etc/s3-ca/ca-bundle.pem}
                - {name: PREP_THREADS,  value: "24"}
                - {name: BUCKET,        value: aabdullah-lithium-bipolar-project-fall-2026}
                - {name: PREFIX,        value: network/arm3}
              volumeMounts:
                - {name: work,  mountPath: /work}
                - {name: s3-ca, mountPath: /etc/s3-ca, readOnly: true}
              resources:
                requests: {cpu: "8",  memory: 32Gi}
                limits:   {cpu: "24", memory: 64Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              command: ["bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  mkdir -p /work/rlibs /work/out
                  LOG=/work/out/prep.log
                  exec > >(tee -a "$LOG") 2>&1
                  echo "== $(date -u) arm3-prep =="
                  git clone --filter=blob:none --no-checkout --depth 1 \
                    https://github.com/AliAbdullah12347/Project-CompBio.git /work/repo
                  cd /work/repo
                  git sparse-checkout init --no-cone
                  git sparse-checkout set "/data/analysis_matrices/*" "/data/LM22.txt" \
                    "/de_analysis/data/*" "/network/*" "/de_v2/scripts/*" "/de_final/results/*"
                  git checkout
                  mkdir -p network/cache network/runs
                  source network/cluster/lib.sh
                  trap 's3_put "$LOG" logs/prep.log || true' EXIT

                  setup_r
                  echo "== rebuilding the base-001 reference =="
                  Rscript network/cluster/prep_cache.R

                  echo "== publishing cache to S3 =="
                  s3_put network/cache/ref_control_all_bicor_signed_p12_ds4_mch00_offsetrm.rds \
                         cache/ref_control_all_bicor_signed_p12_ds4_mch00_offsetrm.rds
                  s3_put network/cache/project.rds cache/project.rds
                  s3_put network/cache/rebuild_verification.csv cache/rebuild_verification.csv
                  echo "== $(date -u) prep done =="
